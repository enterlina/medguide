[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medguide-evidence-engine"
version = "0.1.0"
description = "Offline-first evidence ingestion engine for MedGuide"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
experiments = [
  "sentence-transformers>=6,<7",
  "torch>=2,<3",
]
data = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
]
ai = ["openai>=2.36,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

